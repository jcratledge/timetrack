<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#0f2a30"/>
      <stop offset="0.6" stop-color="#081416"/>
      <stop offset="1" stop-color="#040909"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00b0f0" stroke-opacity="0.07" stroke-width="2"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#grid)"/>

  <!-- clock ring --><circle cx="256" cy="262" r="148" fill="none" stroke="#00b0f0" stroke-opacity="0.05" stroke-width="70"/><circle cx="256" cy="262" r="148" fill="none" stroke="#00b0f0" stroke-opacity="0.08" stroke-width="54"/><circle cx="256" cy="262" r="148" fill="none" stroke="#00b0f0" stroke-opacity="0.12" stroke-width="40"/>
  <circle cx="256" cy="262" r="148" fill="#061012" stroke="#00b0f0" stroke-width="22" filter="url(#glow)"/>
  <!-- ticks at 12 / 3 / 6 / 9 -->
  <g stroke="#7fd6f5" stroke-width="12" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="142" x2="256" y2="166"/>
    <line x1="376" y1="262" x2="352" y2="262"/>
    <line x1="256" y1="382" x2="256" y2="358"/>
    <line x1="136" y1="262" x2="160" y2="262"/>
  </g>
  <!-- glow --><polyline points="186,244 238,296 338,178" fill="none" stroke="#00b0f0" stroke-opacity="0.08" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/><polyline points="186,244 238,296 338,178" fill="none" stroke="#00b0f0" stroke-opacity="0.14" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/><!-- hands form a checkmark: short hour hand to ~8:30, long minute hand to ~1:30 -->
  <g filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="186,244 238,296 338,178" stroke="#e6f9ff" stroke-width="30"/>
  </g>
  <circle cx="238" cy="296" r="13" fill="#00b0f0" filter="url(#soft)"/>
</svg>
